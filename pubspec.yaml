name: satarkscan
description: SatarkScan - Scam Detection & Safety App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_messaging: ^14.7.10
  firebase_storage: ^11.5.6

  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0

  # OCR
  google_mlkit_text_recognition: ^0.11.0

  # Ads
  google_mobile_ads: ^4.0.0

  # HTTP
  http: ^1.1.0
  dio: ^5.4.0

  # Utils
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  image_picker: ^1.0.7
  permission_handler: ^11.1.0
  connectivity_plus: ^5.0.2

  # Speed Test
  network_info_plus: ^4.1.0

  # State Management
  provider: ^6.1.1

  # Storage
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
